name: Installer

# Crea l'APK Android e l'installer Windows.
# - Avvio a mano (tab Actions > Installer > Run workflow): i file finiscono negli "Artifacts" del run.
#   Se scrivi una versione (es. 1.0.0) crea anche la Release vX.Y.Z con i due file da scaricare.
# - Push di un tag vX.Y.Z (es. v1.0.0): crea la Release vX.Y.Z con i due file.
# - Pull request: controlla che gli installer si costruiscano (file negli Artifacts, nessuna Release).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare come Release (es. 1.0.0). Vuoto = solo build."
        required: false
        default: ""
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "La versione deve essere nel formato 1.2.3" >&2
              exit 1
            fi
            echo "name=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Firma con una chiave fissa, se è stata configurata nei secrets del repository
      # (vedi README). Senza, l'APK è firmato con una chiave di debug diversa a ogni build.
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=mp4player
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --build-name ${{ needs.version.outputs.name }} --build-number ${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk ../mp4Player-${{ needs.version.outputs.name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mp4Player-*-android.apk

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Server in un unico .exe
        working-directory: server
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --name mp4player-server --collect-submodules uvicorn --collect-submodules yt_dlp --collect-all ytmusicapi --distpath ../dist run_server.py

      - name: App Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --build-name ${{ needs.version.outputs.name }} --build-number ${{ github.run_number }}

      # Le DLL di Visual C++ accanto all'exe: così l'app parte anche sui PC dove non sono installate.
      - name: Runtime Visual C++
        shell: pwsh
        run: |
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" app\build\windows\x64\runner\Release\
          }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ needs.version.outputs.name }} installer\windows\mp4player.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/mp4Player-*-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Nomi fissi, così i link ".../releases/latest/download/..." del README puntano sempre all'ultima versione.
      - run: |
          mv mp4Player-*-android.apk mp4Player-android.apk
          mv mp4Player-*-windows-setup.exe mp4Player-windows-setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: Carrots MP4 ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** download `mp4Player-windows-setup.exe` and open it. It contains the app and the download server.
            **Android:** download `mp4Player-android.apk` on your phone and open it (allow "Install unknown apps").
          files: |
            mp4Player-android.apk
            mp4Player-windows-setup.exe
